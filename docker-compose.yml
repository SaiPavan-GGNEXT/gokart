# Default: `docker compose up` → API alone, memory store, embedded-index
# validation against the REAL full-corpus index. Works instantly, no downloads.
#
# Profiles demonstrate the extensibility seams:
#   docker compose --profile postgres up    → durable store (STORE=postgres), port 8082
#   docker compose --profile redis up       → RedisValidator (VALIDATOR=redis), port 8081
#   docker compose --profile pipeline up    → live coupon updates via MinIO (S3-compatible), port 8083
#     upload a new coupons.idx at http://localhost:9001 (kart/kart12345) or with `mc` —
#     the API hot-swaps it within COUPON_RELOAD_INTERVAL, no restart.
#   docker compose --profile livebuild up   → LIVE artifact creation (port 8084):
#     downloads the 2.1 GB corpus from S3 (once — cached in a volume, sha256-verified),
#     builds the index in front of you (pass1/pass2 logs stream), then boots the API
#     from the freshly created artifact. Pre-warm before demos: make prewarm-corpus.

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      STORE: memory
      SEED_PRODUCTS: "true"
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ---------- profile: redis --------------------------------------------------
  redis:
    image: redis:7-alpine
    profiles: [redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed-redis:
    build: .
    profiles: [redis]
    entrypoint: ["/app/seedredis", "-addr", "redis:6379", "-index", "/app/data/coupons.idx"]
    depends_on:
      redis:
        condition: service_healthy

  api-redis:
    build: .
    profiles: [redis]
    ports:
      - "8081:8080"
    environment:
      STORE: memory
      SEED_PRODUCTS: "true"
      VALIDATOR: redis
      REDIS_ADDR: redis:6379
    depends_on:
      seed-redis:
        condition: service_completed_successfully

  # ---------- profile: pipeline (S3-compatible object store) --------------------
  # MinIO stands in for S3: same bucket/object model, console UI, mc CLI, and
  # even bucket event notifications — the whole deploy/aws story, locally.
  minio:
    image: quay.io/minio/minio:latest
    profiles: [pipeline]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: kart
      MINIO_ROOT_PASSWORD: kart12345
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket, publish the committed index, and allow
  # anonymous read+write. Reads let the server plain-GET the index (as it
  # would from S3); writes let cmd/watcher plain-PUT rebuilt artifacts.
  # DEMO ONLY — a real bucket uses credentials/presigned URLs for writes.
  seed-minio:
    image: quay.io/minio/mc:latest
    profiles: [pipeline]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/coupons.idx:/seed/coupons.idx:ro
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 kart kart12345 &&
             mc mb -p local/coupons &&
             mc cp /seed/coupons.idx local/coupons/index/coupons.idx &&
             mc anonymous set public local/coupons"

  api-pipeline:
    build: .
    profiles: [pipeline]
    ports:
      - "8083:8080"
    environment:
      STORE: memory
      SEED_PRODUCTS: "true"
      COUPON_INDEX: http://minio:9000/coupons/index/coupons.idx
      COUPON_RELOAD_INTERVAL: 15s
    depends_on:
      seed-minio:
        condition: service_completed_successfully

  # ---------- profile: livebuild (create the artifact in front of you) ----------
  # The full pipeline as a local run: fetch raw corpus → build the exact index
  # → serve from it. Demonstrates that the committed coupons.idx is merely the
  # pipeline's cached output, reproducible from source at any time.
  # (Jobs run as root because named volumes are root-owned on first use; the
  # serving container stays distroless nonroot and mounts the artifact ro.)
  fetch-corpus:
    image: alpine:3
    profiles: [livebuild]
    user: "0:0"
    volumes:
      - corpus:/corpus
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        base=https://orderfoodonline-files.s3.ap-southeast-2.amazonaws.com
        want1=df1883fb03f5dee2f5076efda84d35a74342b77bc19bf524dc5fab8fe8c79740
        want2=e95ca9e921dfcb58535eba805f936564cbb95f76c4d15d635de76caf991b6887
        want3=32f7b98c255db7bf7e06212774daf68277537de3e261def5821737f0e51923bb
        for i in 1 2 3; do
          f=/corpus/couponbase$$i.gz
          eval want=\$$want$$i
          if [ -f "$$f" ] && [ "$$(sha256sum "$$f" | cut -d' ' -f1)" = "$$want" ]; then
            echo "OK   couponbase$$i.gz already present and sha256-verified"
            continue
          fi
          echo "GET  couponbase$$i.gz (~700 MB)..."
          wget -q -O "$$f.part" "$$base/couponbase$$i.gz"
          got=$$(sha256sum "$$f.part" | cut -d' ' -f1)
          if [ "$$got" != "$$want" ]; then
            echo "FATAL sha256 mismatch for couponbase$$i.gz: got $$got" >&2
            rm -f "$$f.part"; exit 1
          fi
          mv "$$f.part" "$$f"
          echo "OK   couponbase$$i.gz downloaded and verified"
        done

  build-index:
    build: .
    profiles: [livebuild]
    user: "0:0"
    entrypoint: ["/app/indexer"]
    command:
      - "-out"
      - "/artifact/coupons.idx"
      - "/corpus/couponbase1.gz"
      - "/corpus/couponbase2.gz"
      - "/corpus/couponbase3.gz"
    environment:
      TMPDIR: /artifact # spill files (~3.1 GB) live and die in the volume
    volumes:
      - corpus:/corpus:ro
      - artifact:/artifact
    depends_on:
      fetch-corpus:
        condition: service_completed_successfully

  api-livebuild:
    build: .
    profiles: [livebuild]
    ports:
      - "8084:8080"
    environment:
      STORE: memory
      SEED_PRODUCTS: "true"
      COUPON_INDEX: /artifact/coupons.idx
    volumes:
      - artifact:/artifact:ro
    depends_on:
      build-index:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ---------- profile: postgres ------------------------------------------------
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart
      POSTGRES_DB: kart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart -d kart"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-postgres:
    build: .
    profiles: [postgres]
    ports:
      - "8082:8080"
    environment:
      STORE: postgres
      DATABASE_URL: postgres://kart:kart@db:5432/kart?sslmode=disable
      SEED_PRODUCTS: "true"
    depends_on:
      db:
        condition: service_healthy

  # ---------- profile: replica (primary/replica postgres + snapshot cache) -------
  # Real streaming replication: writes go to db-primary, catalog reads go to
  # db-replica, and the API serves the menu from an in-memory snapshot that a
  # background refresher rebuilds from the REPLICA every 10s. The primary
  # never sees read traffic.
  db-primary:
    image: postgres:16-alpine
    profiles: [replica]
    environment:
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart
      POSTGRES_DB: kart
    volumes:
      - ./deploy/compose/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart -d kart"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-replica:
    image: postgres:16-alpine
    profiles: [replica]
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    environment:
      POSTGRES_PASSWORD: unused # initdb never runs; PGDATA comes from pg_basebackup
    volumes:
      - ./deploy/compose/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart -d kart"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-replica:
    build: .
    profiles: [replica]
    ports:
      - "8085:8080"
    environment:
      STORE: postgres
      DATABASE_URL: postgres://kart:kart@db-primary:5432/kart?sslmode=disable
      DATABASE_REPLICA_URL: postgres://kart:kart@db-replica:5432/kart?sslmode=disable
      CATALOG_REFRESH_INTERVAL: 10s # demo-fast; production default is 2m
      SEED_PRODUCTS: "true"
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica:
        condition: service_healthy

volumes:
  corpus: {} # raw .gz cache for the livebuild profile (survives restarts)
  artifact: {} # freshly built coupons.idx handed from build-index to the API
